name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.24"
          check-latest: true

  ui:
    name: UI typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Verify embedded bundle is up to date
        run: |
          cd ..
          if [ -n "$(git status --porcelain -- assets/dist)" ]; then
            echo "::error::assets/dist does not match the UI sources. Run 'npm ci && npm run build' in ui/ and commit the regenerated bundle."
            git status --porcelain -- assets/dist
            exit 1
          fi

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: go-apidocs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
