<!DOCTYPE html>
<html>
  <head>
    <title>API Reference & Developer Guide</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #FFFFFF;
      }

      /* Custom Top Navigation Banner */
      .guide-topbar {
        background: rgba(9, 13, 22, 0.9);
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(12px);
      }

      .guide-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #FFFFFF;
        font-weight: 800;
        font-size: 17px;
      }

      .guide-brand-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .guide-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .guide-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(148, 163, 184, 0.15);
        color: #CBD5E1;
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .guide-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(99, 102, 241, 0.4);
        color: #FFFFFF;
      }

      .guide-btn.active {
        background: rgba(99, 102, 241, 0.2);
        border-color: rgba(99, 102, 241, 0.5);
        color: #FFFFFF;
        font-weight: 700;
      }

      .guide-btn-primary {
        background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
        border: none;
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
      }

      .guide-btn-primary:hover {
        background: linear-gradient(135deg, #818CF8 0%, #4F46E5 100%);
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.6);
      }

      /* Custom overrides for Scalar theme */
      .scalar-api-reference {
        --scalar-font: 'Plus Jakarta Sans', sans-serif;
        --scalar-font-code: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body>
    <!-- Topbar Navigation -->
    <header class="guide-topbar">
      <a href="/" class="guide-brand">
        <div class="guide-brand-icon">⚡</div>
        <span>API Docs <span style="color: #818CF8; font-weight: 600; font-size: 14px; margin-left: 6px;">Developer Guide</span></span>
      </a>
      <div class="guide-actions">
        <a href="/" class="guide-btn">
          🏠 Home
        </a>
        <a href="/guide" class="guide-btn active">
          📖 Developer Guide
        </a>
        <a href="/docs" class="guide-btn">
          ⚡ API Sandbox
        </a>
        <a href="/dashboard" class="guide-btn">
          📊 System Health
        </a>
        <a href="/docs/swagger.json" download="swagger.json" class="guide-btn guide-btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          OpenAPI Spec
        </a>
      </div>
    </header>

    <!-- Scalar ReadMe-Style Interactive Engine -->
    <script
      id="api-reference"
      data-url="/docs/swagger.json"
      data-configuration='{
        "theme": "deepSpace",
        "layout": "modern",
        "showSidebar": true,
        "searchHotKey": "k",
        "hideDownloadButton": false,
        "defaultHttpClient": {
          "targetKey": "shell",
          "clientKey": "curl"
        },
        "hiddenClients": [],
        "spec": {
          "url": "/docs/swagger.json"
        },
        "authentication": {
          "preferredSecurityScheme": "BearerAuth"
        },
        "metaData": {
          "title": "API Reference & Guide",
          "description": "Interactive REST API documentation and developer guides."
        }
      }'>
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
